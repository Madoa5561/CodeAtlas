name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/py312.txt
      - run: python -m pip install -e ".[dev]" -c constraints/py312.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/py312.txt
      - run: python -m pip install -e ".[dev]" -c constraints/py312.txt
      - run: python -m mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/py312.txt
      - run: python -m pip install -e ".[dev]" -c constraints/py312.txt
      - run: python -m coverage run -m pytest
      - run: python -m coverage report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/py312.txt
      - run: python -m pip install -e ".[dev]" -c constraints/py312.txt
      - run: python -m build
