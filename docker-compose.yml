name: codeatlas

services:
  codeatlas:
    image: ghcr.io/madoa5561/codeatlas:${CODEATLAS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CODEATLAS_APPLICATION__ENVIRONMENT: production
      CODEATLAS_LOGGING__FORMAT: json
      CODEATLAS_DATABASE__URL: sqlite:////app/data/codeatlas.db
      CODEATLAS_QDRANT__ENABLED: "${CODEATLAS_QDRANT__ENABLED:-false}"
      CODEATLAS_QDRANT__URL: ${CODEATLAS_QDRANT__URL:-http://qdrant:6333}
      CODEATLAS_OLLAMA__BASE_URL: ${CODEATLAS_OLLAMA__BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - codeatlas-data:/app/data
      # Mount only explicitly approved repositories read-only, for example:
      # - /approved/repositories/linejs:/repositories/linejs:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles: ["qdrant"]
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  codeatlas-data:
  qdrant-data:
